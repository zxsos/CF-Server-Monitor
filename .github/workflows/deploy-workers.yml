name: Deploy Worker (cf-server-monitor)

# 本仓库上游那份 deploy.yml 生成的配置里 name 写的是 "server-monitor-pro"，
# 每次 push 都会另建一个与线上共用同一个 D1 和 DO 命名空间的重复 Worker，
# 并且忽略仓库里的 wrangler.toml。上游工作流已在 Actions 里停用，部署改走这里。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-workers-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: 安装依赖
        run: npm install
      - name: 构建前端资源
        run: npm run build:frontend
      - name: 生成 wrangler 配置
        run: |
          cat > wrangler.deploy.toml << 'WEOF'

          # 与上游 deploy.yml 的差异只有三处：worker 名字改回线上实际在用的
          # cf-server-monitor、main 指向本仓库新增的 cron 包装入口、不声明 [triggers]
          # （两条 cron 已交还账户配额，由同账户的 scheduler 中枢用 fetch 驱动 /__cron）。

          WEOF
          sed -i "s|D1_PLACEHOLDER|${{ secrets.D1_DATABASE_ID }}|g" wrangler.deploy.toml
          sed -i "s|SECRET_PLACEHOLDER|${{ secrets.API_SECRET }}|g" wrangler.deploy.toml
          sed -i "s|USER_NAME_PLACEHOLDER|${{ secrets.API_USER_NAME }}|g" wrangler.deploy.toml
          sed -i "s|CORS_ORIGINS_PLACEHOLDER|${{ secrets.CORS_ALLOWED_ORIGINS }}|g" wrangler.deploy.toml
      - name: 部署
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          wranglerVersion: '4'
          config: wrangler.deploy.toml
